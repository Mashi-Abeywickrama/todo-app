services:
  db:
    image: mysql:8
    container_name: todo-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: todo-backend
    restart: on-failure
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    container_name: todo-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data: